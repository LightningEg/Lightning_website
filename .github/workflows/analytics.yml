name: Refresh analytics

# Sends GoatCounter's totals to the private Apps Script receiver (nothing is committed:
# this repository is public). See README > Analytics and consent.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytics.yml"
      - "analytics/goatcounter_daily.py"
  schedule:
    - cron: "29 */8 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to refresh (4 normally, 90 to fill in history)"
        default: "4"

permissions:
  contents: read

concurrency:
  group: lightning-analytics
  cancel-in-progress: false

jobs:
  refresh:
    environment: website-analytics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Send GoatCounter totals to the receiver
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
          ANALYTICS_READ_KEY: ${{ secrets.ANALYTICS_READ_KEY }}
          GH_TOKEN: ${{ github.token }}
          REFRESH_DAYS: ${{ inputs.days || '4' }}
        run: python analytics/goatcounter_daily.py "$REFRESH_DAYS"
