name: Refresh analytics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytics.yml"
      - "analytics/goatcounter_daily.py"
  schedule:
    - cron: "29 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lightning-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh GoatCounter analytics
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: python analytics/goatcounter_daily.py

      - name: Commit refreshed CSV
        run: |
          if [ -z "$(git status --porcelain -- analytics/)" ]; then
            echo "No analytics changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/*.csv
          git commit -m "Analytics: refresh daily data"
          git push origin HEAD:main
