name: Website security checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  website-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13'}
      - run: |
          node apps-script/tests/feedback-security.test.js
          node apps-script/tests/website-receiver.test.js
          node apps-script/tests/receiver.test.js
          node analytics/tests/rules.test.js
          python tools/site_check.py
          python apps-script/tests/test_deploy_receiver.py
          python tools/deploy_receiver.py --output /tmp/LightningAppsScript.gs
          node --check < /tmp/LightningAppsScript.gs
