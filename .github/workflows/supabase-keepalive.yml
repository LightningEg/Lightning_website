name: Supabase keep-alive
# A free Supabase project pauses after a week without activity, which would sign everyone out of For Geeks.
# Every two days this reads one public catalog row with the publishable key (the same key the site uses).
# A failure here means the project is paused or unreachable: restore it from the Supabase dashboard.
on:
  schedule:
    - cron: '23 5 */2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, sparse-checkout: js/forgeeks-config.js, sparse-checkout-cone-mode: false}
      - run: |
          set -euo pipefail
          url=$(sed -n 's/.*supabaseUrl: "\([^"]*\)".*/\1/p' js/forgeeks-config.js)
          key=$(sed -n 's/.*anonKey: "\([^"]*\)".*/\1/p' js/forgeeks-config.js)
          test -n "$url" && test -n "$key"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/rest/v1/catalog_items?select=id&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "Supabase answered $code"
          test "$code" = 200
